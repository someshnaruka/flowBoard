<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/flowboard-brand/favicon.svg"
    />
    <link rel="icon" type="image/x-icon" href="/flowboard-brand/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/flowboard-brand/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/flowboard-brand/favicon-16.png"
    />
    <link
      rel="apple-touch-icon"
      href="/flowboard-brand/apple-touch-icon.png"
    />
    <meta name="theme-color" content="#7B68EE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Flowboard</title>
    <script>
      ;(function () {
        try {
          var key = 'flowboard.theme'
          var stored = localStorage.getItem(key)
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
